events {
    worker_connections 1024;
}

http {
    # a second, independent rate-limit layer in front of the app — see Phase 7 theory doc for why
    # this exists alongside the app's own Redis-backed limiter, not instead of it
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream instabackend {
        server app:4000;
    }

    server {
        listen 80;

        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://instabackend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
